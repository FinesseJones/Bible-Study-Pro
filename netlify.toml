[build]
  command   = "pnpm run build"
  publish   = "dist/public"
  functions = "server/functions"

[build.environment]
  NODE_VERSION = "20"

# ── API passthrough → Netlify Functions ─────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# ── Strict passthroughs for PWA-critical assets ──────────────────────────────
# Service worker must be served from root — never rewritten
[[redirects]]
  from   = "/sw.js"
  to     = "/sw.js"
  status = 200

# Web App Manifest must be served from root — never rewritten  
[[redirects]]
  from   = "/manifest.webmanifest"
  to     = "/manifest.webmanifest"
  status = 200

# Workbox runtime chunk passthrough
[[redirects]]
  from   = "/workbox-*.js"
  to     = "/workbox-:splat.js"
  status = 200

# ── SPA fallback (must be last) ───────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers for PWA assets ───────────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/pwa-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
